<title>Amua Curve Quiz</title>
<style>
  :root{
    --bg:#fffdf5;
    --card:#ffffff;
    --cream:#fff6d6;
    --ink:#000000;
    --ink-soft:#6d6552;
    --accent:#fecd4d;
    --accent-line:#eab93c;
    --line:#f0e7cd;
    --good:#2E9E6B;
    --good-soft:#E6F4EC;
    --bad:#D9534F;
    --bad-soft:#FBE9E8;
    --gold:#E8A33D;
    --radius:16px;
    --shadow:0 2px 10px rgba(60,50,10,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .top{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:14px 16px;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .back{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    border:0;background:none;font-size:22px;color:var(--ink-soft);cursor:pointer;
    padding:6px 10px;border-radius:10px;visibility:hidden;
  }
  .back:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
  .logo{font-weight:900;font-size:26px;letter-spacing:-1px;line-height:1;color:var(--ink)}
  .progress{display:flex;gap:5px;max-width:520px;margin:14px auto 0;padding:0 20px}
  .progress span{flex:1;height:5px;border-radius:99px;background:var(--line);transition:background .3s}
  .progress span.on{background:var(--accent)}
  .wrap{max-width:520px;margin:0 auto;padding:22px 20px 60px}
  .eyebrow{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:2.2px;
    text-transform:uppercase;color:var(--ink);background:var(--cream);
    padding:5px 12px;border-radius:99px;margin-bottom:14px;
  }
  h1{font-size:25px;line-height:1.25;font-weight:800;text-wrap:balance;margin-bottom:8px}
  .sub{color:var(--ink-soft);font-size:15px;line-height:1.55;margin-bottom:20px}
  .sub b{color:var(--ink)}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
    padding:16px 16px;font-size:16px;font-weight:600;color:var(--ink);
    cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .1s,background .15s;
  }
  .opt:active{transform:scale(.985)}
  .opt .em{font-size:20px;width:26px;text-align:center;flex:none}
  .opt.quiet{font-weight:500;color:var(--ink-soft);box-shadow:none}
  .opt.sel{border-color:var(--accent-line);background:var(--cream)}
  .opt .tick{
    margin-left:auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);
    flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
  }
  .opt.sel .tick{background:var(--accent);border-color:var(--accent-line);color:var(--ink)}
  .btn{
    display:block;width:100%;border:0;cursor:pointer;margin-top:22px;
    background:var(--accent);color:var(--ink);font-size:17px;font-weight:800;
    padding:17px;border-radius:99px;box-shadow:0 6px 16px rgba(254,205,77,.45);
    transition:transform .1s,background .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
  .microcopy{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:12px}
  /* checkpoint reviews */
  .carousel{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .rev{
    flex:0 0 84%;scroll-snap-align:center;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  }
  .imgwrap{position:relative;margin-bottom:12px}
  .baimg{display:block;width:100%;border-radius:12px}
  .weekchip{
    position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.68);color:#fff;
    font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    padding:4px 10px;border-radius:99px;
  }
  .rev .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;flex-wrap:wrap}
  .badge{
    font-size:10.5px;font-weight:700;color:var(--good);background:var(--good-soft);
    border-radius:99px;padding:3px 9px;letter-spacing:.2px;
  }
  .stars{color:var(--gold);font-size:14px;letter-spacing:2px;margin:6px 0 8px}
  .rev p{font-size:14px;line-height:1.55;color:var(--ink)}
  /* education */
  .edu-card{
    background:var(--cream);border:1px solid #efdf9d;border-radius:var(--radius);
    padding:18px;margin:18px 0;
  }
  .edu-card h2{font-size:21px;font-weight:800;line-height:1.3;margin-bottom:10px}
  .edu-card p{font-size:14.5px;line-height:1.6}
  .edu-card p + p{margin-top:8px}
  .xlist{list-style:none;margin:14px 0;display:flex;flex-direction:column;gap:9px}
  .xlist li{
    display:flex;gap:10px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:14.5px;font-weight:600;line-height:1.4;box-shadow:var(--shadow);
  }
  .xlist .x{color:var(--bad);font-weight:900;flex:none}
  .flip{
    background:var(--good-soft);border:1px solid #C9E8D8;border-radius:var(--radius);
    padding:16px;font-size:14.5px;line-height:1.6;
  }
  .flip b{color:var(--good)}
  .flip .big{display:block;font-weight:800;font-size:16px;margin-top:8px;color:var(--ink)}
  .listhead{font-size:15px;font-weight:800;margin:16px 0 4px}
  /* loader */
  .loaderbox{text-align:center;padding-top:26px}
  .ring{
    width:66px;height:66px;border-radius:50%;margin:0 auto 22px;
    border:6px solid var(--line);border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .checks{max-width:330px;margin:22px auto 0;text-align:left;display:flex;flex-direction:column;gap:13px}
  .chk{display:flex;gap:11px;align-items:center;font-size:15px;font-weight:600;color:var(--ink-soft);opacity:.35;transition:opacity .4s}
  .chk .c{
    width:22px;height:22px;border-radius:50%;background:var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;
    transition:background .3s;
  }
  .chk.done{opacity:1;color:var(--ink)}
  .chk.done .c{background:var(--good)}
  /* summary */
  .expect{display:flex;flex-direction:column;gap:9px;margin:16px 0 20px}
  .expect div{
    display:flex;gap:9px;align-items:flex-start;font-size:14.5px;font-weight:600;line-height:1.45;
    background:var(--good-soft);border:1px solid #C9E8D8;border-radius:12px;padding:11px 13px;
  }
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow)}
  .pcard .tag{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
    padding:4px 11px;border-radius:99px;margin-bottom:10px;
  }
  .pcard.now .tag{color:var(--bad);background:var(--bad-soft)}
  .pcard.goal .tag{color:var(--good);background:var(--good-soft)}
  .fig{
    height:96px;border-radius:11px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:44px;
  }
  .pcard.now .fig{background:linear-gradient(160deg,#f6f0da,#ece2bd)}
  .pcard.goal .fig{background:linear-gradient(160deg,#fee49b,#fecd4d)}
  .metric{margin-bottom:11px}
  .metric .k{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
  .metric .v{font-size:13px;font-weight:700;margin:2px 0 5px;line-height:1.25}
  .bars{display:flex;gap:4px}
  .bars i{flex:1;height:6px;border-radius:99px;background:var(--line)}
  .now .bars i.f{background:var(--bad)}
  .goal .bars i.f{background:var(--good)}
  .fineprint{
    font-size:12px;color:var(--ink-soft);line-height:1.5;text-align:center;
    border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;margin-top:16px;
  }
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none}.ring{animation-duration:2.5s}
    .opt,.btn{transition:none}
  }
  @media(min-width:560px){h1{font-size:28px}}
</style>

let idx = 0;
const stage = document.getElementById("stage");
const backBtn = document.getElementById("backBtn");
const progress = document.getElementById("progress");
for(let i=0;i<QUESTION_SCREENS;i++){progress.appendChild(document.createElement("span"));}

backBtn.addEventListener("click",()=>{ if(idx>0){ idx--; render(); } });

function qIndex(i){
  let n=0; for(let k=0;k<=i;k++){ const t=screens[k].type; if(!t||t==="multi") n++; }
  return n;
}
function updateChrome(){
  const cur = screens[idx];
  backBtn.style.visibility = (idx>0 && cur.type!=="loader" && cur.type!=="summary") ? "visible":"hidden";
  const done = qIndex(idx);
  [...progress.children].forEach((s,i)=>s.classList.toggle("on", i<done));
  progress.style.display = (cur.type==="loader"||cur.type==="summary") ? "none":"flex";
}
function next(){ if(idx<screens.length-1){ idx++; render(); } }

function render(){
  updateChrome();
  const s = screens[idx];
  track("screen_view", s.id);
  stage.innerHTML = "";
  const box = document.createElement("div");
  box.className = "fade";
  if(!s.type) renderSingle(s,box);
  else if(s.type==="multi") renderMulti(s,box);
  else if(s.type==="checkpoint") renderCheckpoint(box);
  else if(s.type==="education") renderEducation(box);
  else if(s.type==="loader") renderLoader(box);
  else if(s.type==="summary") renderSummary(box);
  stage.appendChild(box);
  window.scrollTo({top:0});
}

function optBtn(o, onPick){
  const b=document.createElement("button");
  b.className="opt"+(o.quiet?" quiet":"");
  b.innerHTML=(o.em?`<span class="em">${o.em}</span>`:"")+`<span>${o.t}</span>`;
  b.addEventListener("click",()=>onPick(b,o));
  return b;
}

function renderSingle(s,box){
  box.innerHTML = (s.label?`<span class="eyebrow">${s.label}</span>`:"")+`<h1>${s.q}</h1>`+(s.sub?`<p class="sub">${s.sub}</p>`:"");
  const wrap=document.createElement("div");wrap.className="opts";
  s.opts.forEach(o=>{
    wrap.appendChild(optBtn(o,(b)=>{
      [...wrap.children].forEach(c=>c.classList.remove("sel"));
      b.classList.add("sel");
      answers[s.id]=o.t;
      track("answer", s.id, o.t);
      setTimeout(next,260);
    }));
  });
  box.appendChild(wrap);
}

function renderMulti(s,box){
  multiSel = new Set(answers[s.id]||[]);
  box.innerHTML = (s.label?`<span class="eyebrow">${s.label}</span>`:"")+`<h1>${s.q}</h1><p class="sub">${s.sub}</p>`;
  const wrap=document.createElement("div");wrap.className="opts";
  const cont=document.createElement("button");
  cont.className="btn";cont.textContent="Continue →";cont.disabled=multiSel.size===0;
  s.opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt"+(multiSel.has(o.t)?" sel":"");
    b.innerHTML=`<span>${o.t}</span><span class="tick">✓</span>`;
    b.addEventListener("click",()=>{
      if(multiSel.has(o.t)){multiSel.delete(o.t);b.classList.remove("sel");}
      else{multiSel.add(o.t);b.classList.add("sel");}
      cont.disabled=multiSel.size===0;
    });
    wrap.appendChild(b);
  });
  cont.addEventListener("click",()=>{answers[s.id]=[...multiSel];track("answer",s.id,[...multiSel].join(" | "));next();});
  box.appendChild(wrap);box.appendChild(cont);
}

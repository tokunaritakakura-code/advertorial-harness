<script>
// URLからパラメータを取得する関数
function getParameterByName(name, url) {
  if (!url) url = window.location.href;
  name = name.replace(/[\[\]]/g, '\\$&');
  var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
      results = regex.exec(url);
  if (!results) return null;
  if (!results[2]) return '';
  return decodeURIComponent(results[2].replace(/\+/g, ' '));
}
// param2の値を取得
var param2Value = getParameterByName('param2');
// 記事内のすべてのaタグにparam2パラメータを追加する関数
function appendParamToLinks(paramName, paramValue) {
  var links = document.querySelectorAll('a');
  links.forEach(function(link) {
    var href = link.getAttribute('href');
    var separator = href.indexOf('?') !== -1 ? '&' : '?';
    var newHref = href + separator + paramName + '=' + paramValue;
    link.setAttribute('href', newHref);
  });
}
// param2の値がある場合、記事内のaタグにparam2パラメータを追加
if (param2Value) {
  appendParamToLinks('param2', param2Value);
}

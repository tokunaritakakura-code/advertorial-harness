    var sbAncChoices = sbAncChoices || {};
    (function(_) {

        /* 対象のclass */
        const target = '.js-anc-choices';

        _.questionnaire = function(selectors) {
            let elList = document.querySelectorAll(selectors);
            elList.forEach(function(el) {
                let itemList = el.querySelectorAll('.choices');
                let loader = el.querySelector('.loader_wrap');

                itemList.forEach(function(item) {
                    let radio = item.querySelector('.choice-radio');
                    radio.addEventListener('click', function() {
                        item.classList.add('checked');
                        setView();
                    }, false);
                });


                function setView() {
                    itemList.forEach(function(item) {
                        let select = item.querySelector('.selecter');
                        let result = item.querySelector('.results');
                        let woodLine = result.querySelector('.wood-line');


                        item.style.opacity = '0.7';
                        loader.classList.add('open');

                        let onTimer = setTimeout(function() {
                            loader.classList.remove('open');
                            item.style.opacity = '';
                            select.style.display = "none";
                            result.classList.add('show_result');
                            woodLine.classList.add('widthimp');

                            let offTimer = setTimeout(function() {
                                woodLine.classList.remove('widthimp');
                            }, 50)

                        }, 2000)

                    });
                }
            });
        };

        //main
        _.init = function() {
            _.questionnaire(target);
        };

    })(sbAncChoices);
</script>

    (function(_) {

        /* 対象のclass */

        _.setCurrentDate = function(selectors) {
            let date = new Date();
            let yyyy = date.getFullYear();
            let mm = date.getMonth() + 1;
            let dd = date.getDate();
            let dayOfWeek = date.getDay();
            let dayOfWeekStr = ["日", "月", "火", "水", "木", "金", "土"][dayOfWeek];
            let dateString = mm + '月' + dd + '日'

            let elList = document.querySelectorAll(selectors);
            elList.forEach(el => el.innerHTML = dateString);
        };

        //main
        _.init = function() {
            _.setCurrentDate(target);
        };

    })(sbCurrentDate);
</script>

  ①〜⑥ ベタ貼り完成版（画像は設問込み／選択肢だけ表示）
  ①FV(開始) → ②Q1 → ③Q2 → ④動画(自動) → ⑤Q3 → ⑥特典(LPへ)
  URLは変えず、画面だけ切替（is-active）
=============================== -->
<script>
    var questionCheck = questionCheck || {};
    (function(_) {

        _.qNum = function(el) {
            const parent = el.closest('.js-questionChoiceArea');
            const child = el.closest('.js-qBox');
            const nextClass = '.js-' + el.dataset.question;

            if (!parent || !child) return;

            const nextQ = parent.querySelector(nextClass);
            if (!nextQ) {
                console.log('[qNum] 次が見つからない:', nextClass);
                return;
            }

            const nextParent = nextQ.closest('.js-qBox');
            if (!nextParent) return;

            if (step4Timer) {
                clearTimeout(step4Timer);
                step4Timer = null;
            }

            child.classList.remove('is-active');
            nextQ.classList.add('is-active');
            nextParent.classList.add('is-active');

            handleStep4Auto(parent);
        };

        _.goHref = function(el) {
            const href = el.dataset.href;
            if (href) {
                let url = new URL(href);
                let params = url.searchParams;
                const current = new URLSearchParams(location.search);
                [...current.entries()].forEach((param, i) => {
                    params.set(param[0], param[1]);
                });
                window.location.href = url;
            }
        };

        let step4Timer = null;

        function gotoStep5(parent) {
            const nextQ = parent.querySelector('.js-ans05_1');
            if (!nextQ) return;

            const nextParent = nextQ.closest('.js-qBox');
            const curParent = parent.querySelector('.js-q04');

            if (parent.querySelector('.js-q06.is-active')) return;

            if (curParent) curParent.classList.remove('is-active');
            nextQ.classList.add('is-active');
            if (nextParent) nextParent.classList.add('is-active');
        }

        function handleStep4Auto(parent) {
            const step4 = parent.querySelector('.js-q04.is-active');
            if (!step4) return;

            const video = step4.querySelector('video');
            if (!video) return;

            if (step4Timer) {
                clearTimeout(step4Timer);
                step4Timer = null;
            }

            video.muted = true;
            video.playsInline = true;
            video.removeAttribute('loop');

            video.onended = function() {
                gotoStep5(parent);
            };

            try {
                video.currentTime = 0;
                const p = video.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (e) {}
        }

        document.addEventListener('click', function(e) {
            const area = e.target.closest('.js-questionChoiceArea');
            if (!area) return;

            const q = e.target.closest('[data-question]');
            if (q) {
                _.qNum(q);
                return;
            }

            const href = e.target.closest('[data-href]');
            if (href) {
                _.goHref(href);
                return;
            }
        }, true);

        document.addEventListener('DOMContentLoaded', function() {
            const area = document.querySelector('.js-questionChoiceArea');
            if (area) handleStep4Auto(area);
        });

    })(questionCheck);
</script>

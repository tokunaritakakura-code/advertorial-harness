<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ご注文手続き｜ここちドライ</title>
<!-- テスト用の申込のページ。送信はしない（最後は「ここで送信」の印で止まる） -->
<style>
:root{--red:#c9473f;--yel:#fff200;--pink:#fff0f1;--bub:#dff3e4;--org:#ff8c00;--ink:#333;--line:#f2c6cc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pink)}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink);font-size:15px;line-height:1.6}
.wrap{max-width:430px;margin:0 auto;padding:68px 10px 80px}
.timer{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--red);color:#fff;transition:transform .3s}
.timer .in{max-width:430px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:5px 30px 3px 4px;position:relative}
.timer .y{background:var(--yel);color:#d0101a;font-weight:700;font-size:11.5px;line-height:1.35;padding:3px 4px;text-align:center;white-space:nowrap}
.timer .t{flex:1;text-align:center;white-space:nowrap}
.timer .t b{font-size:30px;font-family:"Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1}
.timer .t span{font-size:13px}
.timer .s{font-size:9.5px;text-align:center;letter-spacing:.04em}
.timer .chev{position:absolute;right:8px;top:6px;background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.timer.fold{transform:translateY(-100%)}
.row{display:flex;gap:8px;align-items:flex-start;margin-top:14px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover}
.bub{background:var(--bub);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.06);max-width:calc(100% - 48px)}
.bub b{font-weight:700}
.bimg{border-radius:6px;overflow:hidden;max-width:calc(100% - 48px)}
.bimg img{display:block;width:100%;height:auto}
.card{background:#fff;border-radius:6px;padding:14px 14px 16px;margin:10px 0 0 48px;animation:up .35s ease}
.lab{font-size:13px;font-weight:700}
.req{color:#e60012;font-size:11px;margin-left:6px}
.card input,.card select{width:100%;font-size:16px;padding:10px 10px;border:1px solid #f1a7b1;background:#fff5f6;border-radius:2px;margin-top:6px;font-family:inherit}
.hint{font-size:11.5px;color:#666;margin-top:4px}
.err{color:#e60012;font-size:12.5px;margin-top:6px;display:none}
.link{color:#2a6fd1;font-size:12px;text-decoration:underline;margin-left:10px;cursor:pointer}
.next{display:block;width:62%;margin:12px auto 0;background:var(--org);color:#fff;border:0;border-radius:30px;padding:10px 0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.done .next{background:#ddd;color:#fff;pointer-events:none}
.done input,.done select{background:#fff;border-color:#ddd}
.plan{display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer}
.plan input{width:20px;height:20px;margin:0;flex:none}
.plan img{display:block;flex:1;min-width:0;width:calc(100% - 28px);height:auto}
.plan .gray{flex:1;background:#8c8c8c;color:#fff;text-align:center;font-weight:700;padding:10px 0;border-radius:4px;font-size:14px}
.addr{display:none;margin-top:8px}
.addr p{font-size:13px;font-weight:700;margin-top:8px}
.addr span{display:block;font-size:15px;padding:2px 2px}
.pay{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:10px;margin-top:8px;border-radius:4px;cursor:pointer;font-size:14px}
.pay input{width:18px;height:18px;margin:0}
.last{display:block;width:86%;margin:16px auto 0;background:#e60012;color:#fff;border:0;border-radius:30px;padding:13px 0;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.stop{display:none;margin:14px 0 0 48px;background:#fff;border:2px dashed #e60012;padding:14px;border-radius:6px;font-size:13.5px}
.prog{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#eee;height:34px}
.prog .in{max-width:430px;margin:0 auto;position:relative;height:34px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#ffdca8;transition:width .4s}
.prog b{position:relative;display:block;padding:7px 12px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.modal .m{background:#fff;max-width:360px;width:100%;border-radius:8px;overflow:hidden;text-align:center}
.modal img{display:block;width:100%;height:auto}
.modal p{padding:12px 14px 4px;font-size:14px}
.modal button{margin:8px 0 14px;background:var(--org);color:#fff;border:0;border-radius:30px;padding:10px 30px;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="timer" id="timer"><div class="in">
  <div class="y">本日受付終了まで<br>(最短出荷日で対応)</div>
  <div><div class="t"><span>あと</span><b id="th">00</b><span>時間</span><b id="tm">00</b><span>分</span><b id="ts">00</b><span>秒</span></div>
  <div class="s">※次回発送に間に合うようお示ししています</div></div>
  <button class="chev" id="chev" aria-label="たたむ">⌄</button>
</div></div>

<div class="wrap" id="chat">
  <div class="row"><img class="av" src="img/avatar.jpg" alt="サポート係"><div class="bimg"><img src="img/chat_header.jpg" alt="診断結果 あなたの毎日にいちばん寄りそう下着 ここちドライ やさしさと品のよさを守る安心 この内容でお届けを確認します"></div></div>
  <div class="row"><img class="av" src="img/avatar.jpg" alt=""><div class="bub" id="hello"><b>ここちドライのお届けを承ります。</b><br><b>入力項目はたった5つだけ！90秒で完了します！メールアドレスの入力も必要ありません。</b><br>フォームの入力をもって個人情報を<span style="white-space:nowrap">取得いたします。</span></div></div>

  <!-- 1 お名前 -->
  <div class="card" data-step="1"><p class="lab">お名前（フルネームで入力して下さい）<span class="req">※必須</span></p>
    <input id="name" placeholder="例）山田花子" autocomplete="name"><p class="err" id="e1">お名前を入力してください。</p>
    <button class="next" data-next="1">次へ</button></div>
</div>

<div class="prog"><div class="in"><i id="pbar" style="width:0"></i><b id="ptxt">入力はあと4つ</b></div></div>

<div class="modal" id="modal"><div class="m"><img src="img/chat_header.jpg" alt="診断結果 ここちドライ"><p>お手続きの途中です。<br>あと少しで、あなたの1枚がお届けできます。</p><button id="mclose">手続きを続ける</button></div></div>

<script>
/* 残り時間: その日の24時まで（参考と同じ数え下げ） */
function tick(){var n=new Date(),e=new Date(n);e.setHours(24,0,0,0);var s=Math.max(0,Math.floor((e-n)/1000));
 var p=function(x){return(x<10?'0':'')+x};document.getElementById('th').textContent=p(Math.floor(s/3600));document.getElementById('tm').textContent=p(Math.floor(s%3600/60));document.getElementById('ts').textContent=p(s%60)}
tick();setInterval(tick,1000);
document.getElementById('chev').onclick=function(){document.getElementById('timer').classList.toggle('fold')};
var TN={tenshi:'陽だまりの天使',masei:'不意打ちの宝石',majo:'凛とした白百合',koakuma:'きまぐれな渡り鳥',megami:'よくばり女神'};
var type=(location.search.match(/type=(\w+)/)||[])[1];try{type=type||sessionStorage.getItem('kd_type')}catch(e){}
if(type&&TN[type]){document.getElementById('hello').insertAdjacentHTML('afterbegin','診断結果「'+TN[type]+'」のあなたへ。<br>')}
var chat=document.getElementById('chat'),left=4,plan='5';
function prog(n){left=n;document.getElementById('ptxt').textContent=n>0?'入力はあと'+n+'つ':'入力はおしまい';document.getElementById('pbar').style.width=((5-n)/5*100)+'%'}
function say(html){var r=document.createElement('div');r.className='row';r.innerHTML='<img class="av" src="img/avatar.jpg" alt=""><div class="bub">'+html+'</div>';chat.appendChild(r);return r}
function sayImg(src,alt){var r=document.createElement('div');r.className='row';r.innerHTML='<img class="av" src="img/avatar.jpg" alt=""><div class="bimg"><img src="'+src+'" alt="'+alt+'"></div>';chat.appendChild(r)}
function card(html,step){var c=document.createElement('div');c.className='card';c.setAttribute('data-step',step);c.innerHTML=html;chat.appendChild(c);setTimeout(function(){c.scrollIntoView({behavior:'smooth',block:'center'})},50);return c}
function done(c){c.classList.add('done');var b=c.querySelector('.next');if(b){b.textContent='OK'}}
var name='';
var steps={
 1:function(c){var v=c.querySelector('#name').value.trim();if(!v)return false;name=v;done(c);prog(3);
   say('次に「電話番号」を入力して下さい。');
   card('<p class="lab">電話番号<span class="req">※必須</span></p><input id="tel" type="tel" inputmode="numeric" placeholder="例）09012345678" autocomplete="tel"><p class="hint">「-」ハイフンを除いて番号のみを入力ください</p><p class="err" id="e2"></p><button class="next" data-next="2">次へ</button>',2);return true},
 2:function(c){var v=c.querySelector('#tel').value.replace(/\D/g,''),e=c.querySelector('#e2');
   if(/^0[789]0/.test(v)&&v.length!==11){e.textContent=v.slice(0,3)+'で始まる電話番号は11桁で入力して下さい。';e.style.display='block';return false}
   if(!/^0\d{9,10}$/.test(v)){e.textContent='電話番号に誤りがあります。正しい番号を入力してください。';e.style.display='block';return false}
   e.style.display='none';done(c);prog(2);
   say(esc(name)+'様の「配送先のご住所」を<span style="white-space:nowrap">教えてください。</span>');
   card('<p class="lab">郵便番号<span class="req">※必須</span><a class="link" href="https://www.post.japanpost.jp/zipcode/" target="_blank" rel="noopener">郵便番号が分からない方はこちら</a></p><input id="zip" type="tel" inputmode="numeric" placeholder="例）1040061" maxlength="8"><p class="hint">「-」ハイフンを除いて番号のみを入力ください</p><div class="addr" id="addr"><p>都道府県</p><input id="pref"><p>市区町村</p><input id="city"><p>番地・建物名</p><input id="a2" placeholder="例）1-22-11 銀座大竹ビジデンス2階"></div><p class="err" id="e3"></p><button class="next" data-next="3">次へ</button>',3);
   var z=document.getElementById('zip');z.addEventListener('input',function(){var d=z.value.replace(/\D/g,'');if(d.length===7)lookup(d)});return true},
 3:function(c){var e=c.querySelector('#e3'),d=c.querySelector('#zip').value.replace(/\D/g,'');
   if(d.length!==7){e.textContent='郵便番号は7桁の数字で入力してください。';e.style.display='block';return false}
   if(!c.querySelector('#pref').value||!c.querySelector('#city').value||!c.querySelector('#a2').value){document.getElementById('addr').style.display='block';e.textContent='都道府県・市区町村・番地は必須項目です。入力してください。';e.style.display='block';return false}
   e.style.display='none';done(c);
   say('お届けは「5枚セット」と「10枚セット」のどちらにしますか？');
   sayImg('img/chat_upsell.jpg','診断を受けた方だけ 10枚セットが一番人気 毎日はき替えても洗い替えに困らない 安心をまとう ムレとニオイの悩みにアプローチ 外出も夜も1枚でOK');
   sayImg('img/chat_box.jpg','5枚セット 洗濯ネット1個つき 診断を受けた方だけ 10枚セット 一番人気 洗濯ネット2個つき');
   card('<p class="lab"><span class="req" style="margin:0">※必須</span></p><label class="plan"><input type="radio" name="plan" value="10"><img src="img/chat_plan.jpg" alt="一番人気 10枚セットプランに変更する"></label><label class="plan"><input type="radio" name="plan" value="5"><span class="gray">5枚セットにする</span></label><p class="lab" style="margin-top:14px">サイズ<span class="req">※必須</span></p><select id="size"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option><option>4XL</option></select><p class="lab" style="margin-top:10px">色</p><select id="color"><option>クラシック</option><option>ベージュ</option><option>ブラック</option></select><p class="hint">サイズが合わない時は、30日以内なら無料で<span style="white-space:nowrap">交換できます</span></p><p class="err" id="e4">どちらかを選んでください。</p>',4);
   document.querySelectorAll('input[name=plan]').forEach(function(r){r.onchange=function(){var cc=r.closest('.card');if(cc.classList.contains('done'))return;plan=r.value;done(cc);cc.querySelectorAll('input[name=plan]').forEach(function(x){x.disabled=true});
     say('それでは「配送方法」と「お届け希望時間帯」を選択してください。');
     card('<p class="lab">配送方法</p><select id="ship"><option>ポストへお届け（日本郵便）</option><option>手渡しでお届け（日本郵便）</option></select><p class="hint" style="color:#e60012">※「ポストへお届け」をご希望の場合はお届け希望時間帯指定は出来ません。あらかじめご了承ください。</p><p class="lab" style="margin-top:12px">お届け希望時間帯</p><select id="when"><option>指定なし</option><option>午前中</option><option>12～14時</option><option>14～16時</option><option>16～18時</option><option>18～20時</option><option>19～21時</option></select><button class="next" data-next="5">次へ</button>',5)}});
   return true},
 5:function(c){done(c);prog(1);
   say('最後に、お支払い方法を選択して下さい。');
   say('お支払いの手間を、<span style="white-space:nowrap">できるだけ少なくしたい方へ。</span>');
   sayImg('img/chat_pay0.jpg','そんなあなたへ クレジットカード Apple Pay Google Pay 手数料無料 クレジットカード・Apple Pay・Google Pay なら ず〜っと 手数料0円 ラクして安心、断然オススメ');
   card('<p class="lab">お支払い方法<span class="req">※必須</span><a class="link" href="#" onclick="return false">お支払いについて</a></p><label class="pay"><input type="radio" name="pay" value="card" checked>クレジットカード（手数料無料）</label><label class="pay"><input type="radio" name="pay" value="apple">Apple Pay（手数料無料）</label><label class="pay"><input type="radio" name="pay" value="google">Google Pay（手数料無料）</label><p class="hint">お届けは'+(plan==='10'?'10枚セット 23,890円':'5枚セット 17,890円')+'（'+document.getElementById('size').value+'・'+document.getElementById('color').value+'・税込・全国送料無料・30日間返金保証）</p><button class="last" id="fin" data-stop="send">確認画面へ進む</button>',6);
   document.getElementById('fin').onclick=function(){prog(0);document.getElementById('stop').style.display='block';document.getElementById('stop').scrollIntoView({behavior:'smooth'})};
   var s=document.createElement('div');s.className='stop';s.id='stop';s.setAttribute('data-stop','here');s.innerHTML='<b>ここで送信</b>（テスト用のページのため、送信していません。本番ではこの後に確認画面と注文の確定が<span style="white-space:nowrap">出ます）</span>';chat.appendChild(s);
   return true}
};
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var PREF={'1':'北海道','2':'青森県','3':'岩手県'};
function lookup(d){var a=document.getElementById('addr');a.style.display='block';
  var ctl=new AbortController();setTimeout(function(){ctl.abort()},4000);
  fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+d,{signal:ctl.signal}).then(function(r){return r.json()}).then(function(j){var x=j.results&&j.results[0];if(x){document.getElementById('pref').value=x.address1;document.getElementById('city').value=x.address2+x.address3}}).catch(function(){});
  document.getElementById('a2').focus()}
chat.addEventListener('click',function(e){var b=e.target.closest('[data-next]');if(!b)return;var c=b.closest('.card');if(c.classList.contains('done'))return;
  var ok=steps[b.getAttribute('data-next')](c);var er=c.querySelector('.err');if(!ok&&b.getAttribute('data-next')==='1'&&er)er.style.display='block'});
/* 離脱を止める窓（参考: 150秒操作が無い時・戻るを押した時に1回） */
var shown=false,idle;function arm(){clearTimeout(idle);idle=setTimeout(pop,150000)}
function pop(){if(shown)return;shown=true;document.getElementById('modal').style.display='flex'}
['click','keydown','touchstart','scroll'].forEach(function(ev){window.addEventListener(ev,arm,{passive:true})});arm();
try{history.pushState({k:1},'');window.addEventListener('popstate',function(){if(!shown){pop();history.pushState({k:1},'')}})}catch(e){}
document.getElementById('mclose').onclick=function(){document.getElementById('modal').style.display='none'};
</script>
</body>
</html>
